name: Deploy Panchayat AI backups with existing account secrets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/panchayat-backups.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: techgaon/techgaon.github.io
          ref: e926d9c61b42758e1986aee16a722a7344bc4148
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate backup switching
        run: node --test panchayatai/ai-fallback-worker/test/*.test.mjs
      - name: Verify existing account configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = fc14ce3ea45e9966cc8933371cecc0ad
      - name: Deploy only the reviewed fallback Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config panchayatai/ai-fallback-worker/wrangler.toml
      - name: Configure Groq if a private key is present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            printf '%s' "$GROQ_API_KEY" | npx --yes wrangler@4 secret put GROQ_API_KEY --config panchayatai/ai-fallback-worker/wrangler.toml
          fi
      - name: Verify deployed backup configuration
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 https://panchayat-ai-fallback.surajbhanpandey853.workers.dev/panchayatai/api/ai-health | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{const j=JSON.parse(s);if(j.status!=="online"||j.configured.cloudflare!==true)process.exit(1);console.log("Cloudflare backup online; Groq configured: "+j.configured.groq)})'
